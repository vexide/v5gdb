[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.5", features = ["derive"] }
digest-io = "0.1.0"
flate2 = "1.1.11"
fs_extra = "1.3.0"
goblin = "0.10.7"
indicatif = "0.18.6"
nix = { version = "0.32.0", features = ["signal"] }
serde_json = "1.0.151"
sha2 = "0.11"
tar = "0.4.46"
toml = "1.1.4"
ureq = "3.5.2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
