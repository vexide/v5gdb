[package]
name = "v5gdb-cli"
version = "0.1.0-beta.1"
edition = "2024"
description = "Connects GDB to the v5gdb debugger on a VEX V5 brain"
repository = "https://github.com/vexide/v5gdb"
homepage = "https://github.com/vexide/v5gdb"
categories = ["command-line-utilities", "development-tools::debugging", "embedded"]
keywords = ["vex-v5", "debugger", "gdb", "vexide", "PROS"]
authors = [
    "Lewis McClelland <lewis@lewismcclelland.me>",
]

[package.metadata.dist]
formula = "v5gdb"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
cobs = "0.5.0"
pin-project = "1.1.13"
regex = "1.13.1"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vex-v5-serial = { version = "0.5.2", default-features = false, features = ["serial"] }
which = "8.0.0"

[[bin]]
name = "v5gdb"
path = "./src/main.rs"
