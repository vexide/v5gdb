[package]
name = "v5gdb-ffi"
version = "0.0.1" # Update in root Cargo.toml instead
edition = "2024"
publish = false

[lib]
name = "v5gdb"
crate-type = ["staticlib"]

[build-dependencies]
cbindgen = "0.29.4"

[dependencies]
v5gdb = { path = "../", default-features = false }
spin.workspace = true
vex-sdk.workspace = true
# The FFI library never sets a `log` logger, so the log calls in dependencies (mainly gdbstub) can
# never print anything. Compile them out to save space.
log = { version = "0.4.29", features = ["max_level_off"] }
